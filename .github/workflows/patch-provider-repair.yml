name: Patch provider assignment repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-provider-repair.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index safely
        shell: python
        run: |
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, got {count}")
              s = s.replace(old, new, 1)

          replace_once(
              'const API_PROVIDER_SWITCH_RYR = "https://ruonmntlrtrtbmvzbnik.supabase.co/functions/v1/ryr-provider-switch";\n',
              'const API_PROVIDER_SWITCH_RYR = "https://ruonmntlrtrtbmvzbnik.supabase.co/functions/v1/ryr-provider-switch";\n'
              'const API_ASSIGNMENT_REPAIR_UES = "https://fksbytkpdbcjbwakunpp.supabase.co/functions/v1/ues-assignment-repair";\n'
              'const API_ASSIGNMENT_REPAIR_RYR = "https://ruonmntlrtrtbmvzbnik.supabase.co/functions/v1/ryr-assignment-repair";\n',
              "repair API constants",
          )

          replace_once(
              '<div class="hero-actions"><button id="refreshAllBtn" class="btn secondary" onclick="refrescarTodo()" title="Reprocesa los errores activos y luego vuelve a leer UES, RyR y SendGround">↻ Actualizar</button><button class="btn secondary" onclick="probarConexiones()">Probar conexiones</button></div>',
              '<div class="hero-actions"><button id="refreshAllBtn" class="btn secondary" onclick="refrescarTodo()" title="Corrige asignaciones del proveedor activo, reprocesa pedidos abiertos, actualiza el panel y prueba conexiones UES / RyR">↻ Actualizar</button></div>',
              "hero refresh button",
          )

          replace_once(
              '''function providerSwitchBase(provider){
  return String(provider||"UES").toUpperCase()==="RYR"
    ?API_PROVIDER_SWITCH_RYR
    :API_PROVIDER_SWITCH_UES;
}
''',
              '''function providerSwitchBase(provider){
  return String(provider||"UES").toUpperCase()==="RYR"
    ?API_PROVIDER_SWITCH_RYR
    :API_PROVIDER_SWITCH_UES;
}

function assignmentRepairBase(provider){
  return String(provider||"UES").toUpperCase()==="RYR"
    ?API_ASSIGNMENT_REPAIR_RYR
    :API_ASSIGNMENT_REPAIR_UES;
}

async function repararAsignacionesProveedor(provider,orderCode){
  const p=String(provider||"UES").toUpperCase();
  const res=await fetch(assignmentRepairBase(p),{
    method:"POST",
    headers:{
      "X-Admin-Password":PASSWORD,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({orderCode})
  });
  let data;
  try{data=await res.json()}catch{data={error:`HTTP ${res.status} sin JSON válido`}}
  if(!res.ok||data?.ok===false){
    throw Object.assign(new Error(data?.error||data?.detalle||`No se pudieron reparar asignaciones ${p}`),{status:res.status,data,provider:p});
  }
  return data;
}
''',
              "assignment repair helper",
          )

          replace_once(
              '''    if(esAdopcion?entrada.adopted!==true:entrada.activated!==true){
      throw new Error(entrada.detalle||`${state.target} no confirmó la ${esAdopcion?"adopción":"activación"}.`);
    }

    PROVIDER_SWITCH_PREVIEW=null;
''',
              '''    if(esAdopcion?entrada.adopted!==true:entrada.activated!==true){
      throw new Error(entrada.detalle||`${state.target} no confirmó la ${esAdopcion?"adopción":"activación"}.`);
    }

    el.innerHTML=`<div class="alert warn">Proveedor destino activo.<br>Reasignando todas las tareas abiertas asignables a ${esc(state.target)} sin tocar Completadas/Canceladas…</div>`;
    const reparacion=await repararAsignacionesProveedor(state.target,orderCode);
    if(reparacion.active!==true){
      throw new Error(`${state.target} quedó vinculado pero la reparación no lo reconoce como proveedor activo.`);
    }

    let continuacionError=null;
    try{
      const rp=await apiProvider(state.target,"reprocess",{
        method:"POST",
        body:{order_code:orderCode}
      });
      if(rp?.ok===false)continuacionError="El reproceso del flujo devolvió error";
    }catch(e){
      continuacionError=e?.message||String(e);
    }

    PROVIDER_SWITCH_PREVIEW=null;
''',
              "switch post-activation repair",
          )

          replace_once(
              '''    el.innerHTML=`<div class="alert ok manual-success"><b>✓ ${esAdopcion?"Cambio sincronizado":"Cambio completado"}: ${esc(state.origin)} → ${esc(state.target)}</b><br>${esc(entrada.detalle||"Proveedor destino vinculado correctamente.")}<br>${esc(cancelText)} · ${esc(modeText)}${entrada.providerOrderCode?` · <span class="mono">${esc(entrada.providerOrderCode)}</span>`:""}</div>`;
''',
              '''    const asignacionText=reparacion.repaired
      ?`${(reparacion.reassignedTaskIds||[]).length} tarea(s) abierta(s) reasignada(s) y verificadas`
      :"Asignaciones abiertas verificadas";
    const continuidadText=continuacionError?` · Continuación pendiente: ${continuacionError}`:" · Flujo reprocesado";
    el.innerHTML=`<div class="alert ok manual-success"><b>✓ ${esAdopcion?"Cambio sincronizado":"Cambio completado"}: ${esc(state.origin)} → ${esc(state.target)}</b><br>${esc(entrada.detalle||"Proveedor destino vinculado correctamente.")}<br>${esc(cancelText)} · ${esc(modeText)} · ${esc(asignacionText)}${esc(continuidadText)}${entrada.providerOrderCode?` · <span class="mono">${esc(entrada.providerOrderCode)}</span>`:""}</div>`;
''',
              "switch success detail",
          )

          replace_once(
              '''  if(btn){btn.disabled=true;btn.innerHTML="↻ Reprocesando…";}

  try{
    toast("Sincronizando todos los pedidos abiertos de UES y RyR…");
''',
              '''  if(btn){btn.disabled=true;btn.innerHTML="↻ Actualizando…";}

  try{
    toast("Corrigiendo asignaciones y sincronizando pedidos abiertos de UES y RyR…");
''',
              "refresh label",
          )

          replace_once(
              '''        try{
          const r=await apiProvider(job.provider,"reprocess",{
            method:"POST",
            body:{order_code:job.orderCode}
          });
          resultados.push({provider:job.provider,orderCode:job.orderCode,ok:r?.ok!==false});
        }catch(e){
          resultados.push({provider:job.provider,orderCode:job.orderCode,ok:false,error:e?.message||String(e)});
        }
''',
              '''        try{
          // Primero corregimos ownership: TODA tarea Warehouse todavía abierta
          // debe pertenecer al proveedor activo. Completed/Canceled no se tocan.
          const repair=await repararAsignacionesProveedor(job.provider,job.orderCode);
          const r=await apiProvider(job.provider,"reprocess",{
            method:"POST",
            body:{order_code:job.orderCode}
          });
          resultados.push({
            provider:job.provider,
            orderCode:job.orderCode,
            ok:r?.ok!==false,
            repaired:repair?.repaired===true,
            reassigned:Number(repair?.reassignedTaskIds?.length||0)
          });
        }catch(e){
          resultados.push({provider:job.provider,orderCode:job.orderCode,ok:false,error:e?.message||String(e)});
        }
''',
              "refresh worker repair",
          )

          replace_once(
              '''    await new Promise(r=>setTimeout(r,700));
    await Promise.all([cargarDashboard(true),cargarReviews()]);

    const ok=resultados.filter(x=>x.ok).length;
    const fail=resultados.length-ok;
''',
              '''    await new Promise(r=>setTimeout(r,700));
    await Promise.all([cargarDashboard(true),cargarReviews()]);

    // "Actualizar" también reemplaza al antiguo botón "Probar conexiones".
    try{await probarConexiones()}catch{}

    const ok=resultados.filter(x=>x.ok).length;
    const fail=resultados.length-ok;
    const repaired=resultados.filter(x=>x.repaired).length;
    const reassigned=resultados.reduce((acc,x)=>acc+Number(x.reassigned||0),0);
''',
              "refresh connections",
          )

          replace_once(
              '''    }else if(fail===0&&fuentesFallidas.length===0){
      toast(`Panel sincronizado · ${ok} pedido${ok===1?"":"s"} revisado${ok===1?"":"s"}`);
    }else{
''',
              '''    }else if(fail===0&&fuentesFallidas.length===0){
      toast(`Panel sincronizado · ${ok} pedido${ok===1?"":"s"} revisado${ok===1?"":"s"}${reassigned?` · ${reassigned} tarea${reassigned===1?"":"s"} reasignada${reassigned===1?"":"s"} en ${repaired} pedido${repaired===1?"":"s"}`:""}`);
    }else{
''',
              "refresh success toast",
          )

          p.write_text(s, encoding="utf-8")

      - name: Commit patched index
        run: |
          git config user.name "gocargo-code-bot"
          git config user.email "gocargouruguay@gmail.com"
          git add index.html
          git diff --cached --check
          git commit -m "Repair provider assignments during switch and refresh"
          git push origin HEAD:main
