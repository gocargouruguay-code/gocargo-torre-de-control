<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GoCargo / UES / RyR — Torre de control</title>
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f6fa;color:#172033}.loading{max-width:560px;margin:80px auto;background:#fff;border:1px solid #dfe6ee;border-radius:14px;padding:28px;box-shadow:0 8px 28px rgba(19,40,70,.08)}.loading h1{margin:0 0 8px;color:#00275B;font-size:22px}.loading p{margin:0;color:#687386;line-height:1.5}.error{color:#b42318}
</style>
</head>
<body>
<div class="loading" id="boot"><h1>GoCargo — Torre de control</h1><p>Cargando panel…</p></div>
<script>
(async()=>{
  const boot=document.getElementById("boot");
  try{
    const res=await fetch("./app-base.html?v=87a85a4a5eb5930c100c70f22af7d2733d2ab94f",{cache:"no-store"});
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    let html=await res.text();
    const addon='<script src="./provider-repair.js?v=368af91572c0a1a0468441d474c26914f947b8ae"></'+'script>';
    if(!html.includes("</body>"))throw new Error("El HTML base no contiene </body>");
    html=html.replace("</body>",addon+"\n</body>");
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    boot.innerHTML='<h1>No se pudo cargar la Torre</h1><p class="error">'+String(err?.message||err).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+'</p>';
  }
})();
</script>
</body>
</html>
